<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"> 
<title>WSoft</title>
<link rel="stylesheet" href="./css/com.css?5465" type="text/css"  />
<script src="./../../../../js/vue.global.js"></script>
<script src="./../../../../js/axios.min.js"></script>
</head>
<body>

<div id="updWin" class="updWin" >
    <div class="updWin-info" id="updWin-info" style="display:none">
        <div class="left" id="updWin-info-msg"></div>
        <div class="right" onclick="closeInfoMsg(event)">&Chi;</div>
    </div>
    <div class="updWin-content" >
        <div class="updWin-content-item" >
            <div class="left">Title</div>
            <div class="right"><input type="text" v-model="dataitem.config.fieldtitle" /></div>
        </div>
        <div class="updWin-content-item" >
            <div class="left">HTML Content: </div>
            <div class="right" style="line-height: 40px;">
                <textarea v-model="dataitem.tempcontent"  style="width:90%;height:300px"></textarea>
            </div>
        </div>
    </div>
</div>

<script>

const ComConfigVue = 
{
    data() 
    {
        return {
            viewdatas:null,
            datafields:null,
            dataitem:{"comid":"20","fields":[],"comname":"HTML","comtitle":"","temptype":"1","tempcontent":"","code":{},"config":{"fieldtitle":"","formshow":true}}
        }
    },
    methods: 
    {
        getDataItem() 
        {
            this.dataitem.comtitle = this.dataitem.config.fieldtitle;
            this.dataitem.config.viewhtml=this.dataitem.tempcontent;
            return this.dataitem;
        },
        setDataItem(dataitem) 
        {
            this.dataitem=dataitem;
        },
        setFormValue(fValue,codename) 
        {
            let c = this.dataitem['code'];
            c[codename] = fValue;
        },
        getFormValue(codename) 
        {
            let c = this.dataitem['code'];
            return c[codename];
        }
    },
    mounted() 
    {
        window.getDataItem = this.getDataItem;
        window.setDataItem = this.setDataItem;
        window.setFormValue = this.setFormValue;
        window.getFormValue = this.getFormValue;
    }
}

Vue.createApp(ComConfigVue).mount('#updWin');

</script>

</body>
</html>
