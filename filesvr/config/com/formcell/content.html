
<div class="content-tab[@configid@]" id="datalist[@configid@]" style="display:none">
    <div class="content-tab-title">
        <span>[@fieldtitle@]：<span v-show="!this.isView">[@fieldnoemptylbl@]</span>
    </div>
    <div class="content-tab-filter" v-show="!this.isView&&this.celltype=='1'" >
        <div class="actionbtns">
            <input  type="button" value="+[@capaddbtn@]" @click="addDatas" />
        </div>
    </div>
    <div class="content-tab-con"  v-if="!this.isView">
        <table class="tabdata" >
            [@btnhtml@]
        </table> 
    </div>
    <div class="content-tab-con" v-if="this.isView">
        <table class="tabdata" >
            [@btnhtmlview@]
        </table> 
    </div>
    <div class="content-info[@configid@]" id="content-info1[@configid@]" style="display:none">
        <div class="left" id="content-info-msg1[@configid@]"></div>
        <div class="right" onclick="closeInfoMsg[@configid@](event)">&Chi;</div>
    </div>
    <span style="color:red;display:none" id="valmsg1[@configid@]"></span>
</div>
