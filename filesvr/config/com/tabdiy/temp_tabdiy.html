<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"> 
<title>WSoft</title>
<link rel="stylesheet" href="./css/template.css" type="text/css"  />	
<script src="./../../../../js/vue.global.js"></script>
<script src="./../../../../js/axios.min.js"></script>
<script src="./../../../templates/js/template.js"></script>
<script src="./../../../templates/js/selColor.js"></script>

<script>
var gTempform=true;
</script>

</head>
<body scroll="no">
<div class="tmp-action" id="tmp-action" >
    <div class="tmp-action-add  dropitem" style="margin-right:5px">
        <input type="button" value="+新增/编辑容器" onclick="addConParentWin()" style="margin-right:30px" />
        <div class="dropcontent" id="divContainersUpd" style="padding-top:10px"></div>
    </div>
    <div class="tmp-action-add" >
        <input type="button" value="+新增组件" onclick="showComList()" />
        <div class="dropcontent" >
            <ul class="menu-content" id="divContainers" ></ul>
        </div>&nbsp;&nbsp;<input type="button" style="width:80px;background-color: #ccc;" value="粘贴" onclick="pasteCom()" />
    </div>
    <div class="tmp-action-save">
        <input type="button" class="btnOK" value="提交" onclick="saveTemplateList('save')" />
        <input type="button" class="btnOK" value="初始代码" onclick="openCodeValWin('initformdatas')" />
        <input type="button" class="btnCancle" value="返回" onclick="parent.closeTempFormWin()" />
        <div class="main-wrapper-info" id="main-wrapper-info" style="display:none">
            <div class="left" id="main-wrapper-info-msg"></div>
            <div class="right" ></div>
        </div>
    </div>
</div>
<div id="comlist" class="comlist" style="display:none">
    <div class="select-tab" >
        <ul>
            <li id="selpage" style="width:20%" class="selected" onclick="selComTab(event)" >页面</li>
            <li id="selform" style="width:20%" onclick="selComTab(event)" >表单</li>
            <li style="width:58%" >&nbsp;</li>
        </ul>
    </div>
    <div id="comlist-selpage" >
    </div>
    <div id="comlist-selform" style="padding:0px;display:none" >
    </div>
</div>
<div class="main-wrapper" id="main-wrapper" style="border:1px solid coral">
    <input type="hidden" value="" id="Inputinitformdatas" />
    <div class="conParentList" id="conParentList" name="表单">
        <div style="clear: both;"></div> 
    </div>
</div>
<div id="coverWin" class="coverWin"></div>
<div id="modalWin" class="modalWin">
    <div class="modalWinMsg"><span id="modalWinMsg"></span></div>
    <div class="modalWinBtn">
        <input type="button" class="btnOK"  value="确定" onclick="openWinOK()" />
        <input type="button" class="btnCancle"  value="取消" onclick="closeWin()" />
    </div>
</div>
<div id="updWin" class="updWin"></div> 
<div id="template-action" class="template-action" style="display:none" >
    <input type="button" value="前" onclick="moveUp(event)" />
    <input type="button" value="后" onclick="moveDown(event)" />
    <input type="button" value="复" onclick="copyCom(event)" />
    <input type="button" value="改" onclick="openUpdWin('',updContainer,event)" />
    <input type="button" value="删" onclick="openWin('确定要删除组件吗？',delContainer,event)" />
</div>
<div id="template-action-con" class="template-action-con" style="display:none" >
    <input type="button" value="前" onclick="moveUp(event)" />
    <input type="button" value="后" onclick="moveDown(event)" />
    <input type="button" value="复" onclick="copyCom(event)" />
    <input type="button" value="贴" onclick="pasteComSub(event)" />
    <input type="button" value="改" onclick="openUpdWin('',updContainer,event)" />
    <input type="button" value="删" onclick="openWin('确定要删除容器吗？',delContainer,event)" />
</div>
<div class="tempForm" id="tempForm" style="display:none">
    <iframe id="tempformiframe" frameborder="no" marginwidth="0" marginheight="0" ></iframe>
</div>
<div class="codeVal" id="codeVal" style="display:none">
    <iframe id="codeValiframe" frameborder="no" marginwidth="0" marginheight="0" ></iframe>
</div>

</body>
</html>
