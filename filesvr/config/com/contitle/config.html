<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"> 
<title>WSoft</title>
<link rel="stylesheet" href="./css/com.css" type="text/css"  />
<script src="./../../../../js/vue.global.js"></script>
<script src="./../../../../js/axios.min.js"></script>
<script src="selColor.js"></script>
</head>
<body>

<div id="updWin" class="updWin" >
    <div class="updWin-content" >
        <div class="updWin-content-item" >
            <div class="left">TitleContent</div>
            <div class="right"><input type="text" v-model="dataitem.config.titlecontent" /></div>
        </div>
        <div class="updWin-content-item" >
            <div class="left">Bookmark Name</div>
            <div class="right"><input type="text" v-model="dataitem.config.titlename" /></div>
        </div>
        <div class="updWin-content-item" >
            <div class="left">Background Color</div>
            <div class="right"><input type="text" v-model="dataitem.config.conbgcolor" id="color-picker-conbgcolor" /></div>
        </div>
        <div class="updWin-content-item" >
            <div class="left">Text Color</div>
            <div class="right"><input type="text" v-model="dataitem.config.concolor" id="color-picker-concolor" /></div>
        </div>
    </div>
</div>

<script>

const ComConfigVue = 
{
    data() 
    {
        return {
            comdatas:null,
            dataitem:{"comid":"5","comname":"PageTitle","comtitle":"","config":{"titlecontent":"","titlename":"","conbgcolor":"#fff","concolor":"rgb(54, 120, 179)"}}
        }
    },
    methods: 
    {
        getDataItem() 
        {
            let viewhtml = "";
            viewhtml = viewhtml + "<div style=\"color: "+ this.dataitem.config.concolor + ";font-size:1.1em;font-weight: bold;background-color:"+ this.dataitem.config.conbgcolor + ";border-radius: 2em;padding-left: 20px;width:100%;box-sizing: border-box;height:40px;line-height: 40px;\">";
            viewhtml = viewhtml + this.dataitem.config.titlecontent
            viewhtml = viewhtml + "</div>";

            this.dataitem.config.viewhtml=viewhtml;
            return this.dataitem;
        },
        setDataItem(dataitem) 
        {
            this.dataitem=dataitem;
        },
        setDataItemByK(k,v) 
        {
            this.dataitem.config[k]=v;
        }
    },
    mounted() 
    {
        window.getDataItem = this.getDataItem;
        window.setDataItem = this.setDataItem;
        window.setDataItemByK = this.setDataItemByK;
    }
}

Vue.createApp(ComConfigVue).mount('#updWin');

Colorpicker.create({
el: "color-picker-conbgcolor", 
color: "", 
change: function (elem, hex) {
    elem.style.borderColor = hex;
    window.setDataItemByK('conbgcolor',hex);
}
});

Colorpicker.create({
el: "color-picker-concolor", 
color: "", 
change: function (elem, hex) {
    elem.style.borderColor = hex;
    window.setDataItemByK('concolor',hex);
}
});

</script>

</body>
</html>
