<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./css/login.css" type="text/css"  />
    <script src="./js/axios.min.js"></script>
    <script src="./js/funclogin.js"></script>
</head>
<body>
<div id="sendRequest" class="loginWin">
    <div class="logImg">
            <img src="./../upload/logo.png" height="36px" />
    </div>
    <div class="loginWin-info" id="loginWin-info-sendrequest" style="display:none">
        <div class="left" id="loginWin-info-sendrequest-msg"></div>
    </div>
    <div class="loginWin-content" >
        <div class="loginWin-content-item" id="divemail" >
            <div class="left">Email</div>
            <div class="right"><input type="text" id="email" /></div>
        </div>
        <div class="loginWin-content-item" id="divmobile">
            <div class="left">Phone</div>
            <div class="right">
                <input type="text" id="mobile" /><br/>
            </div>
        </div>
        <div class="loginWin-content-item">
            <div class="left">CAPTCHA</div>
            <div class="right">
                <input type="text" class="cpachaInput" id="cpachacode1"  />
	            <img id="cpacha-img1" class="cpachaImg" title="Click to switch CAPTCHA"  src="./../user/getcpacha?vl=4&w=150&h=40&type=loginCpacha" onclick="changeCpacha1()">
            </div>
        </div>
        <div class="loginWin-content-item">
            <div class="left">&nbsp;</div>
            <div class="right" style="line-height:50px"><input type="button" class="btnOK"  value="Send Password Request" onclick="getpassword()" /></div>
        </div>
        <div class="content-info" id="content-info-sendrequest" style="display:none">
            <div id="content-info-sendrequest-msg"></div>
        </div>
    </div>
</div>
<div id="setPass" class="loginWin" style="display: none;">
    <div class="logImg">
            <img src="./../upload/logo.png" height="36px" />
    </div>
    <div class="loginWin-info" id="loginWin-info-setpass" style="display:none">
        <div class="left" id="loginWin-info-setpass-msg"></div>
    </div>
    <div class="loginWin-content" >
        <div class="loginWin-content-item">
            <div class="left">Enter Password</div>
            <div class="right"><input type="password" id="password" /></div>
        </div>
        <div class="loginWin-content-item">
            <div class="left">Confirm</div>
            <div class="right"><input type="password" id="passwordconfirm" /></div>
        </div>
        <div class="loginWin-content-item">
            <div class="left">CAPTCHA</div>
            <div class="right">
                <input type="text" class="cpachaInput" id="cpachacode2"  />
	            <img id="cpacha-img2" class="cpachaImg" title="Click to switch CAPTCHA"  src="./../user/getcpacha?vl=4&w=150&h=40&type=loginCpacha" onclick="changeCpacha2()">
            </div>
        </div>
        <div class="loginWin-content-item">
            <div class="left">&nbsp;</div>
            <div class="right"><input type="button" class="btnOK"  value="Reset Password" onclick="setpassword()" /></div>
        </div>
        <div class="content-info" id="content-info-setpass" style="display:none">
            <div id="content-info-setpass-msg"></div>
        </div>
    </div>
</div>

<script>

    var gAmode="";
    init();

    var passkey = getKey();
    if(passkey!="")
    {
        document.getElementById("setPass").style.display="block";
        document.getElementById("sendRequest").style.display="none";
        if(ismobilefunc())
        {
            document.getElementById("setPass").className = "loginWinMobile";
        }
        else
        {
            document.getElementById("setPass").className = "loginWin";
        }
        document.getElementById("setPass").style.display="block";
    }
    else
    {
        document.getElementById("setPass").style.display="none";
        document.getElementById("sendRequest").style.display="block";
        if(ismobilefunc())
        {
            document.getElementById("sendRequest").className = "loginWinMobile";
        }
        else
        {
            document.getElementById("sendRequest").className = "loginWin";
        }
        document.getElementById("sendRequest").style.display="block";
    }

    function getpassword()
    {
        let paras = {};
        paras['email']=document.getElementById("email").value.trim();
        paras['mobile']=document.getElementById("mobile").value.trim();
        paras['cpacha']=document.getElementById("cpachacode1").value.trim();

        let msg="";

        if(gAmode=="")
        {
            alert("System Configuration error.");
            return;
        }
        else if(gAmode=="1")
        {
            if(!gCheckValueNull(paras['email']))
            {
                msg = msg + "Email Cannot be Null.<br/>";
            }
        }
        else if(gAmode=="2")
        {
            if(!gCheckValueNull(paras['mobile']))
            {
                msg = msg + "Phone Cannot be Null.<br/>";
            }
        }
        
        if(!gCheckEmail(paras['email']))
        {
            msg = msg + "Email Invalid address format.";
        }
        if(!gCheckValueLen(paras['email'],200))
        {
            msg = msg+"Email Length cannot exceed 200 characters.<br/>";
        }
        if(!gCheckMobile(paras['mobile']))
        {
            msg = msg + "Phone Invalid format.";
        }
        if(!gCheckValueLen(paras['mobile'],20))
        {
            msg = msg+"Phone Length cannot exceed 20 characters.<br/>";
        }
        if(msg!="")
        {
            document.getElementById("loginWin-info-sendrequest-msg").innerHTML=msg;
            document.getElementById("loginWin-info-sendrequest").style.display="block";
            return;
        }

        axios.post("./../user/getpassword",paras).then(function(res){
            let mreturn = res.data;
            let msg = mreturn['msg'];
            if(msg!="")
            {
                document.getElementById("loginWin-info-sendrequest-msg").innerHTML=msg;
                document.getElementById("loginWin-info-sendrequest").style.display="block";
                changeCpacha1();
            }
            else
            {
                document.getElementById("content-info-sendrequest-msg").innerHTML="The system will send you a reset password link. Please check.";
                document.getElementById("content-info-sendrequest").style.display="block";
            }
        }).catch(function (err) {
        });
    }

    function setpassword()
    {
        let paras = {};
        paras['password']=document.getElementById("password").value.trim();
        paras['passwordconfirm']=document.getElementById("passwordconfirm").value.trim();
        paras['cpacha']=document.getElementById("cpachacode2").value.trim();
        paras['passkey']=passkey;

        let msg="";
        if(!gCheckValueNull(paras['password']))
        {
            msg = msg + "Please enter new password.";
        }
        if(!gCheckValueLen(paras['password'],20))
        {
            msg = msg+"Password cannot exceed 20 characters.<br/>";
        }
        if(paras['password']!=paras['passwordconfirm'])
        {
            msg = msg + "Passwords do not match.";
        }
        if(msg!="")
        {
            document.getElementById("loginWin-info-setpass-msg").innerHTML=msg;
            document.getElementById("loginWin-info-setpass").style.display="block";
            return;
        }

        axios.post("./../user/setpassword",paras).then(function(res){
            let mreturn = res.data
            let msg = mreturn['msg'];   
            if(msg!="")
            {
                document.getElementById("loginWin-info-setpass-msg").innerHTML=msg;
                document.getElementById("loginWin-info-setpass").style.display="block";
                changeCpacha2();
            }
            else
            {
                document.getElementById("content-info-setpass-msg").innerHTML="Password set successfully. Please <a href='./login.html'>Click here to Login</a>.";
                document.getElementById("content-info-setpass").style.display="block";
            }
        }).catch(function (err) {
        });
    }

    function getKey() 
    {
        let pagelocation = document.location.toString();
        let paras = pagelocation.split("?");
        if (paras.length > 1) 
        {
            item = paras[1].split("=");
            if(item[0]=="key")
            {
                return item[1];
            }
        }
        return "";
    }

    function ismobilefunc()
    {
        var ua=navigator.userAgent.toLowerCase();
        var ismobile = false;

        if(contains(ua,"ipad")||(contains(ua,"rv:1.2.3.4"))||(contains(ua,"0.0.0.0"))||(contains(ua,"8.0.552.237"))){return false}
        if((contains(ua,"android") && contains(ua,"mobile"))||(contains(ua,"android") && contains(ua,"mozilla")) ||(contains(ua,"android") && contains(ua,"opera"))
        ||contains(ua,"ucweb7")||contains(ua,"iphone")){ismobile=true;}

        return ismobile;
    }

    function contains(a, b)
    {
        if(a.indexOf(b)!=-1)
            return true;
        else
            return false;
    }

    function init()
    {

        let paras = {};
        axios.post("./../portal/api/configgetamode",paras).then(function(res){
            gAmode = res.data;
            if(gAmode=="1")
            {
                document.getElementById("divmobile").style.display="none";
            }
            else if(gAmode=="2")
            {
                document.getElementById("divemail").style.display="none";
            }
            else
            {
                alert("System Configuration error.");
            }
        }).catch(function (err) {
        });
    }

    function changeCpacha1(){
        document.getElementById("cpacha-img1").src='./../user/getcpacha?vl=4&w=150&h=40&type=loginCpacha&t=' + new Date().getTime();
    }

    function changeCpacha2(){
        document.getElementById("cpacha-img2").src='./../user/getcpacha?vl=4&w=150&h=40&type=loginCpacha&t=' + new Date().getTime();
    }

    </script>
</body>
</html>
